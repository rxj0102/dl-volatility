[project]
name = "dl-volatility"
version = "0.1.0"
description = "Research code for dl-volatility"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "pytorch-forecasting>=1.0.0",
    "pytorch-lightning>=2.0.0",
    "arch>=6.2.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "yfinance>=0.2.28",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
    "joblib>=1.3.0",
    "tqdm>=4.65.0"
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
